name: APK Olustur (BY EDS Saha v16.43)

on:
  push:
    branches: [ apk-v1643 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DXF adlandirma ve yol olcusu duzeltmesi
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,zlib
          exec(zlib.decompress(base64.b64decode('')).decode('utf-8'),{'__name__':'__main__'})
          PY
          node --check app/src/main/assets/ayb-tablet.js
          grep -n "function aybDxfDosyaAdi" app/src/main/assets/ayb-tablet.js
          grep -nE 'versionCode|versionName' app/build.gradle

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenleri
        shell: bash
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: APK olustur ve dogrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          mkdir -p store
          cp app/build/outputs/apk/debug/app-debug.apk store/BY-EDS-SAHA-v16.43-TABLET.apk
          unzip -t store/BY-EDS-SAHA-v16.43-TABLET.apk >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs store/BY-EDS-SAHA-v16.43-TABLET.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging store/BY-EDS-SAHA-v16.43-TABLET.apk | tee /tmp/badging.txt
          grep -q "package: name='com.bayramyaras.aybsaha' versionCode='1643' versionName='16.43'" /tmp/badging.txt
          sha256sum store/BY-EDS-SAHA-v16.43-TABLET.apk | tee store/BY-EDS-SAHA-v16.43-TABLET.apk.sha256
          printf 'BY EDS SAHA Tablet APK\nSurum: 16.43\nDXF adi: trafo numaralari + GG.AA.YYYY\nOrnek: TAC977-TAC978_07.08.2026.dxf\n' > store/BY-EDS-SAHA-v16.43-TABLET-BILGI.txt

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: BY-EDS-SAHA-v16.43-TABLET
          path: |
            store/BY-EDS-SAHA-v16.43-TABLET.apk
            store/BY-EDS-SAHA-v16.43-TABLET.apk.sha256
            store/BY-EDS-SAHA-v16.43-TABLET-BILGI.txt
          if-no-files-found: error
          retention-days: 90

      - name: Dogrulanmis surumu dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets/ayb-tablet.js store/BY-EDS-SAHA-v16.43-TABLET.apk store/BY-EDS-SAHA-v16.43-TABLET.apk.sha256 store/BY-EDS-SAHA-v16.43-TABLET-BILGI.txt
          if ! git diff --cached --quiet; then
            git commit -m "BY EDS Saha v16.43: DXF trafo adlandirma ve kompakt yol olcusu [skip ci]"
            git push origin HEAD:apk-v1643
          fi
