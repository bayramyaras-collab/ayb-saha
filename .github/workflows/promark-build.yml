name: ProMark Saha APK
on:
  push:
    branches: [ promark-saha-v01 ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :promarkapp:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProMark-Saha-v0.1-APK
          path: promarkapp/build/outputs/apk/debug/promarkapp-debug.apk
