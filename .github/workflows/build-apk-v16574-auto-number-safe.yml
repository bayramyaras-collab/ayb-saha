name: APK Olustur (BY EDS Saha v16.57.4 Guvenli Oto No)

on:
  push:
    branches: [ apk-v16574-auto-number-safe ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: v16.57.2 NOT ve temiz arayuz duzeltmelerini uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v16572_note_stable.py

      - name: v16.57.3 kirik nokta korumasini uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v16573_vertex_lock.py

      - name: v16.57.4 guvenli otomatik numarayi uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v16574_auto_number_safe.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          g=Path('app/build.gradle')
          s=g.read_text(encoding='utf-8')
          s=re.sub(r'applicationId\s+"[^"]+"','applicationId "com.bayramyaras.byedssaha.v574"',s,count=1)
          s=re.sub(r'versionCode\s+\d+','versionCode 16574',s,count=1)
          s=re.sub(r'versionName\s+"[^"]+"','versionName "16.57.4"',s,count=1)
          g.write_text(s,encoding='utf-8')
          Path('app/src/main/res/values/strings.xml').write_text('<resources>\n    <string name="app_name">BY EDŞ SAHA V57</string>\n</resources>\n',encoding='utf-8')
          PY
          F=app/src/main/assets/AYB_Saha_Harita.html
          grep -q 'V16.57.4: GUVENLI OTOMATIK NUMARA SECIMI' "$F"
          grep -q 'Trafo numarası değişsin' "$F"
          grep -q 'Manuel yazılmış dolu numara ve adlar her durumda korunur.' "$F"
          grep -q "const cfg={direk:true,box:true,trafo:false" "$F"
          grep -q "p._ayb_auto_no_version='16.57.4'" "$F"
          grep -q 'V16.57.3: KIRIK NOKTA KORUMASI' "$F"
          grep -q 'Otomat Kapağı Yok Kablolar Dışarda' "$F"
          grep -q 'BY EDŞ SAHA V57' "$F"
          if grep -q 'aybV28MobileDock' "$F"; then echo 'Eski v28 dock bulundu'; exit 1; fi
          node --check app/src/main/assets/ayb-tablet.js
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('app/src/main/assets/AYB_Saha_Harita.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          core=next((x for x in scripts if 'function autoNumberProjectObjects(options={})' in x and 'function bindAYBAutoNumberButtons' in x),None)
          if not core: raise SystemExit('oto no motoru bulunamadi')
          Path('/tmp/core.js').write_text(core,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/core.js'],check=True)
          if "else if(isTrafo(o)){p.trafo_no=val;p.no=val;p.numara=val;}" not in core: raise SystemExit('trafo adi koruma satiri yok')
          if 'p.trafo_adi=' in core[core.find('const setNo='):core.find('const graph=')]: raise SystemExit('setNo trafo adini degistiriyor')
          PY

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenleri
        shell: bash
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: APK olustur ve dogrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          mkdir -p store /tmp/apkcheck
          cp app/build/outputs/apk/debug/app-debug.apk store/BYEDS-V57-4.apk
          unzip -t store/BYEDS-V57-4.apk >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging store/BYEDS-V57-4.apk > /tmp/badging.txt
          grep -q "package: name='com.bayramyaras.byedssaha.v574' versionCode='16574' versionName='16.57.4'" /tmp/badging.txt
          grep -q "application-label:'BY EDŞ SAHA V57'" /tmp/badging.txt
          unzip -q store/BYEDS-V57-4.apk 'assets/AYB_Saha_Harita.html' 'assets/ayb-tablet.js' -d /tmp/apkcheck
          F=/tmp/apkcheck/assets/AYB_Saha_Harita.html
          grep -q 'V16.57.4: GUVENLI OTOMATIK NUMARA SECIMI' "$F"
          grep -q 'Trafo numarası değişsin' "$F"
          grep -q 'Manuel yazılmış dolu numara ve adlar her durumda korunur.' "$F"
          grep -q 'V16.57.3: KIRIK NOKTA KORUMASI' "$F"
          if grep -q 'aybV28MobileDock' "$F"; then echo 'APK icinde eski v28 dock bulundu'; exit 1; fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs store/BYEDS-V57-4.apk > store/APK_IMZA_KONTROL.txt
          sha256sum store/BYEDS-V57-4.apk | tee store/BYEDS-V57-4.apk.sha256
          printf 'BY EDŞ SAHA V57\nSürüm: 16.57.4\nGüvenli otomatik numara: Direk ve Box varsayılan açık, Trafo varsayılan kapalı; manuel dolu numara/ad korunur.\n' > store/BILGI.txt

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: BYEDS-V57-4
          path: |
            store/BYEDS-V57-4.apk
            store/BYEDS-V57-4.apk.sha256
            store/APK_IMZA_KONTROL.txt
            store/BILGI.txt
          if-no-files-found: error
