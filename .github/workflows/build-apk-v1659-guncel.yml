name: APK Olustur (BY EDS Saha v16.59 Guncel)

on:
  push:
    branches: [ apk-v1659-guncel ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Kaynak temizligini dogrula
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/ayb-tablet.js
          grep -q 'AYB_V1659_LEGACY_CLEAN' app/src/main/assets/AYB_Saha_Harita.html
          ! grep -q 'AYB Saha Harita Metraj v16.40' app/src/main/assets/AYB_Saha_Harita.html
          grep -q 'applicationId "com.bayramyaras.aybsaha.guncel"' app/build.gradle
          grep -q 'BY EDŞ SAHA GÜNCEL' app/src/main/res/values/strings.xml
          grep -q 'LOAD_NO_CACHE' app/src/main/java/com/bayramyaras/aybsaha/MainActivity.java
          grep -q 'clearCache(true)' app/src/main/java/com/bayramyaras/aybsaha/MainActivity.java
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK kur
        uses: android-actions/setup-android@v3
      - name: SDK bilesenleri
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true
      - name: APK olustur ve dogrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          mkdir -p dist /tmp/apkcheck
          cp app/build/outputs/apk/debug/app-debug.apk dist/BY-EDS-SAHA-v16.59-GUNCEL.apk
          unzip -t dist/BY-EDS-SAHA-v16.59-GUNCEL.apk >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/BY-EDS-SAHA-v16.59-GUNCEL.apk > /tmp/badging.txt
          grep -q "package: name='com.bayramyaras.aybsaha.guncel' versionCode='1659' versionName='16.59'" /tmp/badging.txt
          grep -q "application-label:'BY EDŞ SAHA GÜNCEL'" /tmp/badging.txt
          unzip -q dist/BY-EDS-SAHA-v16.59-GUNCEL.apk 'assets/AYB_Saha_Harita.html' 'assets/ayb-tablet.js' -d /tmp/apkcheck
          ! grep -q 'AYB Saha Harita Metraj v16.40' /tmp/apkcheck/assets/AYB_Saha_Harita.html
          grep -q 'data-tool="sahanot"' /tmp/apkcheck/assets/AYB_Saha_Harita.html
          grep -q 'aybSahaNotGit' /tmp/apkcheck/assets/AYB_Saha_Harita.html
          sha256sum dist/BY-EDS-SAHA-v16.59-GUNCEL.apk > dist/BY-EDS-SAHA-v16.59-GUNCEL.apk.sha256
      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: BY-EDS-SAHA-v16.59-GUNCEL
          path: dist/*
          if-no-files-found: error
