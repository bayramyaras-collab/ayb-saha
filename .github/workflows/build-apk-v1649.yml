name: APK Olustur (BY EDS Saha v16.49)

on:
  push:
    branches: [ apk-v1649 ]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Proje olustur tiklama duzeltmesini uygula ve kontrol et
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v1649.py
          node --check app/src/main/assets/ayb-tablet.js
          ! grep -q "closest('#aybCreateProject')" app/src/main/assets/ayb-tablet.js
          grep -q 'id="aybCreateProject" type="button"' app/src/main/assets/AYB_Saha_Harita.html
          grep -q 'cp.onclick=go;' app/src/main/assets/AYB_Saha_Harita.html
          grep -q 'const makeProject=(typeof newProject==="function")?newProject:window.newProject;' app/src/main/assets/AYB_Saha_Harita.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/AYB_Saha_Harita.html').read_text(encoding='utf-8')
          tag='<script id="ayb_project_center_v13_js">'
          a=s.index(tag)+len(tag)
          b=s.index('</script>',a)
          Path('/tmp/project_center_v13.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/project_center_v13.js

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenleri
        shell: bash
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: APK olustur ve dogrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          mkdir -p store
          cp app/build/outputs/apk/debug/app-debug.apk store/BY-EDS-SAHA-v16.49-TABLET.apk
          unzip -t store/BY-EDS-SAHA-v16.49-TABLET.apk >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose store/BY-EDS-SAHA-v16.49-TABLET.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging store/BY-EDS-SAHA-v16.49-TABLET.apk > /tmp/badging.txt
          grep -q "versionCode='1649' versionName='16.49'" /tmp/badging.txt
          sha256sum store/BY-EDS-SAHA-v16.49-TABLET.apk | tee store/BY-EDS-SAHA-v16.49-TABLET.apk.sha256
          printf 'BY EDS SAHA Tablet APK\nSurum: 16.49\nProje Olustur tiklama engelleyicisi kaldirildi\n' > store/BY-EDS-SAHA-v16.49-TABLET-BILGI.txt

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: BY-EDS-SAHA-v16.49-TABLET
          path: |
            store/BY-EDS-SAHA-v16.49-TABLET.apk
            store/BY-EDS-SAHA-v16.49-TABLET.apk.sha256
            store/BY-EDS-SAHA-v16.49-TABLET-BILGI.txt
          if-no-files-found: error

      - name: Dogrulanmis surumu dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets/AYB_Saha_Harita.html app/src/main/assets/ayb-tablet.js store/BY-EDS-SAHA-v16.49-TABLET.apk store/BY-EDS-SAHA-v16.49-TABLET.apk.sha256 store/BY-EDS-SAHA-v16.49-TABLET-BILGI.txt
          if ! git diff --cached --quiet; then
            git commit -m "BY EDS Saha v16.49 proje olustur duzeltmesi + APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
