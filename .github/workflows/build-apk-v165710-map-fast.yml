name: APK Olustur (BY EDS Saha v16.57.10 Hizli Harita)

on:
  push:
    branches: [ apk-v165710-map-fast ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Calisan v16.57.9 tabanini olustur
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v16578_stable_rebuild.py . >/tmp/v578.txt
          python3 tools/patch_v16579_energy_login.py >/tmp/v579.txt
          F=app/src/main/assets/AYB_Saha_Harita.html
          T=app/src/main/assets/ayb-tablet.js
          grep -q 'id="ayb_v579_boot_js"' "$F"
          grep -q 'Enerji sistemi hazırlanıyor…' "$F"
          grep -q "baseLayers.sat=L.tileLayer('https://mt{s}.google.com/vt/lyrs=s" "$F"
          grep -q "map.on('click',handleMapClick)" "$F"
          grep -q 'data-tool="direk"' "$F"
          grep -q 'data-tool="hat"' "$F"
          node --check "$T"
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          s=Path('app/src/main/assets/AYB_Saha_Harita.html').read_text(encoding='utf-8')
          m=next((m for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I) if 'function initMap()' in m.group(1) and 'function handleMapClick(e)' in m.group(1) and 'function switchBase(v)' in m.group(1)),None)
          if not m: raise SystemExit('ana harita motoru yok')
          Path('/tmp/core_before.txt').write_text(hashlib.sha256(m.group(1).encode()).hexdigest())
          PY

      - name: Harita performansini LED SAHA seviyesine yaklastir
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v165710_map_fast.py | tee /tmp/v5710.txt
          F=app/src/main/assets/AYB_Saha_Harita.html
          J=app/src/main/java/com/bayramyaras/aybsaha/MainActivity.java
          grep -q 'id="ayb_v5710_map_fast"' "$F"
          grep -q 'opt.wheelPxPerZoomLevel=60' "$F"
          grep -q 'opt.markerZoomAnimation=false' "$F"
          grep -q 'opt.fadeAnimation=false' "$F"
          grep -q 'opt.renderer.options.padding=0.35' "$F"
          grep -q 'opt.keepBuffer=2' "$F"
          grep -q 'web.setLayerType(android.view.View.LAYER_TYPE_HARDWARE, null);' "$J"
          grep -q 'id="ayb_v579_boot_js"' "$F"
          grep -q 'Kırık Nokta Düzenlemeyi Aktif Et' "$F"
          grep -q 'Yalnız boş numara alanları değiştirilir.' "$F"
          grep -q 'Otomat Kapağı Yok Kablolar Dışarda' "$F"
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          s=Path('app/src/main/assets/AYB_Saha_Harita.html').read_text(encoding='utf-8')
          m=next((m for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I) if 'function initMap()' in m.group(1) and 'function handleMapClick(e)' in m.group(1) and 'function switchBase(v)' in m.group(1)),None)
          if not m: raise SystemExit('patch sonrasi ana motor yok')
          before=Path('/tmp/core_before.txt').read_text().strip()
          after=hashlib.sha256(m.group(1).encode()).hexdigest()
          if before!=after: raise SystemExit('ana harita motoru degisti')
          print('core korunuyor:',after)
          PY

      - name: Surum ve paket adi
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          g=Path('app/build.gradle');s=g.read_text(encoding='utf-8')
          s=re.sub(r'applicationId\s+"[^"]+"','applicationId "com.bayramyaras.byedssaha.v5710"',s,count=1)
          s=re.sub(r'versionCode\s+\d+','versionCode 165710',s,count=1)
          s=re.sub(r'versionName\s+"[^"]+"','versionName "16.57.10"',s,count=1)
          g.write_text(s,encoding='utf-8')
          Path('app/src/main/res/values/strings.xml').write_text('<resources>\n    <string name="app_name">BY EDŞ SAHA V57</string>\n</resources>\n',encoding='utf-8')
          PY

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenleri
        shell: bash
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: APK olustur ve dogrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          mkdir -p store /tmp/apkcheck
          cp app/build/outputs/apk/debug/app-debug.apk store/BYEDS57-10.apk
          unzip -t store/BYEDS57-10.apk >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging store/BYEDS57-10.apk > /tmp/badging.txt
          grep -q "package: name='com.bayramyaras.byedssaha.v5710' versionCode='165710' versionName='16.57.10'" /tmp/badging.txt
          grep -q "application-label:'BY EDŞ SAHA V57'" /tmp/badging.txt
          unzip -q store/BYEDS57-10.apk 'assets/AYB_Saha_Harita.html' 'assets/ayb-tablet.js' -d /tmp/apkcheck
          F=/tmp/apkcheck/assets/AYB_Saha_Harita.html
          T=/tmp/apkcheck/assets/ayb-tablet.js
          grep -q 'id="ayb_v5710_map_fast"' "$F"
          grep -q 'opt.wheelPxPerZoomLevel=60' "$F"
          grep -q 'opt.markerZoomAnimation=false' "$F"
          grep -q 'opt.fadeAnimation=false' "$F"
          grep -q 'opt.keepBuffer=2' "$F"
          grep -q 'id="ayb_v579_boot_js"' "$F"
          grep -q "map.on('click',handleMapClick)" "$F"
          grep -q 'data-tool="direk"' "$F"
          grep -q 'data-tool="hat"' "$F"
          node --check "$T"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs store/BYEDS57-10.apk > store/APK_IMZA_KONTROL.txt
          sha256sum store/BYEDS57-10.apk | tee store/BYEDS57-10.apk.sha256
          printf 'BY EDŞ SAHA V57\nSürüm: 16.57.10\nHarita performansı: LED SAHA benzeri hızlı zoom; wheel 60, marker/fade animasyonu kapalı, uydu keepBuffer 2, Android WebView GPU katmanı açık. Ana saha motoru korunmuştur.\n' > store/BILGI.txt

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: BYEDS57-10-HIZLI-HARITA
          path: |
            store/BYEDS57-10.apk
            store/BYEDS57-10.apk.sha256
            store/APK_IMZA_KONTROL.txt
            store/BILGI.txt
          if-no-files-found: error
