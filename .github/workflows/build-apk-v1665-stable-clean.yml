name: APK Olustur (BY EDS Saha v16.65 Stabil Temiz)

on:
  push:
    branches: [ apk-v1665-stable-clean-final ]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: v16.58 stabil tabani fiziksel temizle
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/patch_v1665.py
          python3 /tmp/patch_v1665.py app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Android: HTML zaten ayb-tablet.js'i yukluyor; ikinci kez enjekte eden kodu kaldir.
          p=Path('app/src/main/java/com/bayramyaras/aybsaha/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          start=s.find('                // Tablet arayuz eklentisini')
          end=s.find('                // WhatsApp vb. uygulamadan gelen DXF varsa programa aktar', start)
          if start<0 or end<0: raise SystemExit('Cift ayb-tablet yukleme blogu bulunamadi')
          s=s[:start]+s[end:]
          s=s.replace('s.setCacheMode(WebSettings.LOAD_DEFAULT);','s.setCacheMode(WebSettings.LOAD_NO_CACHE);')
          s=s.replace('setContentView(web);','setContentView(web);\n        try { web.clearCache(true); } catch (Exception ignored) {}',1)
          s=s.replace('"AYB_" + System.currentTimeMillis()', '"BY_EDS_" + System.currentTimeMillis()')
          s=s.replace('Environment.DIRECTORY_PICTURES + "/AYB_Saha"', 'Environment.DIRECTORY_PICTURES + "/BY_EDS_Saha"')
          p.write_text(s,encoding='utf-8')

          g=Path('app/build.gradle')
          x=g.read_text(encoding='utf-8')
          x=re.sub(r'applicationId\s+"[^"]+"','applicationId "com.bayramyaras.aybsaha.cleanstable"',x,count=1)
          x=re.sub(r'(?m)^(\s*)versionCode\s+\d+\s*$',r'\1versionCode 1665',x,count=1)
          x=re.sub(r'(?m)^(\s*)versionName\s+"[^"]+"\s*$',r'\1versionName "16.65"',x,count=1)
          g.write_text(x,encoding='utf-8')

          r=Path('app/src/main/res/values/strings.xml')
          y=r.read_text(encoding='utf-8')
          y=re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">BY EDŞ SAHA</string>',y,count=1)
          r.write_text(y,encoding='utf-8')
          PY
          rm -f app/src/main/assets/sw.js

      - name: Temizlik ve islev dogrulama
        shell: bash
        run: |
          set -euo pipefail
          F=app/src/main/assets/AYB_Saha_Harita.html
          J=app/src/main/assets/ayb-tablet.js
          grep -q 'BY EDŞ Saha Programı PERF-25.07-AT-U2' "$F"
          grep -q 'data-tool="sahanot"' "$F"
          grep -q 'aybSahaNotKmzFiles' "$F"
          grep -q 'aybSahaNotGit' "$F"
          grep -q 'ayb_label_size_settings_v3' "$F"
          ! grep -q 'ayb_v28_same_program_mobile' "$F"
          ! grep -q 'aybV28MobileDock' "$F"
          ! grep -q 'aybV28ExportSheet' "$F"
          ! grep -q 'serviceWorker.register' "$F"
          ! grep -q 'beforeinstallprompt' "$F"
          ! grep -q 'AYB Saha Harita Metraj' "$F"
          ! grep -q 'v16.58: Çizim Araçları sırası sabit' "$J"
          ! grep -q 'setInterval(boot,700)' "$J"
          ! grep -q 'ayb-tablet-loader' app/src/main/java/com/bayramyaras/aybsaha/MainActivity.java
          test ! -e app/src/main/assets/sw.js
          node --check "$J"
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('app/src/main/assets/AYB_Saha_Harita.html').read_text(encoding='utf-8')
          g=s[s.index('<div class="ayb-pro-group draw">'):]
          g=g[:g.index('<div class="ayb-pro-title">Çizim Araçları</div>')]
          blocks=re.findall(r'<button\b[^>]*>.*?</button>',g,re.S|re.I)
          order=[]
          for b in blocks:
              m=re.search(r'data-tool="([^"]+)"',b) or re.search(r'id="([^"]+)"',b)
              if m: order.append(m.group(1))
          expected=['direk','trafo','yeraltihat','hat','abonehat','kanal','kofre','bina','box','sahanot','kfMeasureToolBtn','cizgi','ok']
          if order!=expected: raise SystemExit('Cizim sirasi hatali: '+repr(order))
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,code in enumerate(scripts):
              if 'V16.56: FOTOĞRAFLI SAHA NOTU' in code or 'ayb_v1665' in code:
                  q=Path('/tmp')/f'inline_{i}.js';q.write_text(code,encoding='utf-8');subprocess.run(['node','--check',str(q)],check=True)
          PY

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenleri
        shell: bash
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: APK olustur ve icerigini dogrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          mkdir -p store /tmp/apkcheck
          cp app/build/outputs/apk/debug/app-debug.apk store/BY-EDS-SAHA-v16.65-STABIL-TEMIZ-UNSIGNED.apk
          unzip -t store/BY-EDS-SAHA-v16.65-STABIL-TEMIZ-UNSIGNED.apk >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging store/BY-EDS-SAHA-v16.65-STABIL-TEMIZ-UNSIGNED.apk > /tmp/badging.txt
          grep -q "package: name='com.bayramyaras.aybsaha.cleanstable' versionCode='1665' versionName='16.65'" /tmp/badging.txt
          unzip -q store/BY-EDS-SAHA-v16.65-STABIL-TEMIZ-UNSIGNED.apk 'assets/AYB_Saha_Harita.html' 'assets/ayb-tablet.js' -d /tmp/apkcheck
          F=/tmp/apkcheck/assets/AYB_Saha_Harita.html
          grep -q 'data-tool="sahanot"' "$F"
          grep -q 'aybSahaNotKmzFiles' "$F"
          ! grep -q 'aybV28MobileDock' "$F"
          ! grep -q 'serviceWorker.register' "$F"
          ! grep -q 'AYB Saha Harita Metraj' "$F"
          sha256sum store/BY-EDS-SAHA-v16.65-STABIL-TEMIZ-UNSIGNED.apk | tee store/BY-EDS-SAHA-v16.65-STABIL-TEMIZ-UNSIGNED.apk.sha256
          printf 'BY EDŞ SAHA v16.65\nTaban: v16.58 stabil / v16.57 arayüz\nEski v28 mobil arayüz fiziksel olarak kaldırıldı.\nÇift ayb-tablet yükleme ve service worker kaldırıldı.\n' > store/TEMIZLIK_RAPORU.txt

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: BY-EDS-SAHA-v16.65-STABIL-TEMIZ
          path: |
            store/BY-EDS-SAHA-v16.65-STABIL-TEMIZ-UNSIGNED.apk
            store/BY-EDS-SAHA-v16.65-STABIL-TEMIZ-UNSIGNED.apk.sha256
            store/TEMIZLIK_RAPORU.txt
          if-no-files-found: error

      - name: Temiz kaynagi dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/build.gradle app/src/main/java/com/bayramyaras/aybsaha/MainActivity.java app/src/main/res/values/strings.xml app/src/main/assets
          if ! git diff --cached --quiet; then
            git commit -m "BY EDŞ Saha v16.65 stabil temiz kaynak [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
