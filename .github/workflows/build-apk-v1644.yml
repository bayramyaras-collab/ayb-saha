name: APK Olustur (BY EDS Saha v16.44)

on:
  push:
    branches: [ apk-v1644 ]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DXF gorunumunu programla birebir yap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,zlib
          exec(zlib.decompress(base64.b64decode('')).decode('utf-8'),{'__name__':'__main__'})
          PY
          node --check app/src/main/assets/ayb-tablet.js
          grep -q "AYB_KESIK" app/src/main/assets/ayb-tablet.js
          grep -q "aybDxfLineweight" app/src/main/assets/ayb-tablet.js
          grep -q "g(2,'Arial')" app/src/main/assets/ayb-tablet.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*$',r'\1versionCode 1644',s,count=1)
          s,n2=re.subn(r'(?m)^(\s*)versionName\s+"[^"]+"\s*$',r'\1versionName "16.44"',s,count=1)
          if n1!=1 or n2!=1: raise SystemExit('Surum satiri bulunamadi')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenleri
        shell: bash
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: APK olustur ve dogrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          mkdir -p store
          cp app/build/outputs/apk/debug/app-debug.apk store/BY-EDS-SAHA-v16.44-TABLET.apk
          unzip -t store/BY-EDS-SAHA-v16.44-TABLET.apk >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose store/BY-EDS-SAHA-v16.44-TABLET.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging store/BY-EDS-SAHA-v16.44-TABLET.apk > /tmp/badging.txt
          grep -q "versionCode='1644' versionName='16.44'" /tmp/badging.txt
          sha256sum store/BY-EDS-SAHA-v16.44-TABLET.apk | tee store/BY-EDS-SAHA-v16.44-TABLET.apk.sha256
          printf 'BY EDS SAHA Tablet APK\nSurum: 16.44\nDXF: program renk/kesik/kalinlik + Arial etiket + yol merkez + trafo etiket ustte\n' > store/BY-EDS-SAHA-v16.44-TABLET-BILGI.txt

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: BY-EDS-SAHA-v16.44-TABLET
          path: |
            store/BY-EDS-SAHA-v16.44-TABLET.apk
            store/BY-EDS-SAHA-v16.44-TABLET.apk.sha256
            store/BY-EDS-SAHA-v16.44-TABLET-BILGI.txt
          if-no-files-found: error

      - name: Dogrulanmis surumu dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets/ayb-tablet.js store/BY-EDS-SAHA-v16.44-TABLET.apk store/BY-EDS-SAHA-v16.44-TABLET.apk.sha256 store/BY-EDS-SAHA-v16.44-TABLET-BILGI.txt
          if ! git diff --cached --quiet; then
            git commit -m "BY EDS Saha v16.44 DXF gorunum + APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
