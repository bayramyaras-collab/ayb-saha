name: APK Olustur (BY EDS Saha v16.46)

on:
  push:
    branches: [ apk-v1646 ]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DXF APPID acilma duzeltmesini uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v1646.py
          node --check app/src/main/assets/ayb-tablet.js
          grep -q "g(1,'AC1009')" app/src/main/assets/ayb-tablet.js
          if grep -q "g(1,'AC1018')" app/src/main/assets/ayb-tablet.js; then exit 1; fi
          if grep -q "g(370" app/src/main/assets/ayb-tablet.js; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*$',r'\1versionCode 1646',s,count=1)
          s,n2=re.subn(r'(?m)^(\s*)versionName\s+"[^"]+"\s*$',r'\1versionName "16.46"',s,count=1)
          if n1!=1 or n2!=1: raise SystemExit('version lines not found')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenleri
        shell: bash
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: APK olustur ve dogrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          mkdir -p store
          cp app/build/outputs/apk/debug/app-debug.apk store/BY-EDS-SAHA-v16.46-TABLET.apk
          unzip -t store/BY-EDS-SAHA-v16.46-TABLET.apk >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose store/BY-EDS-SAHA-v16.46-TABLET.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging store/BY-EDS-SAHA-v16.46-TABLET.apk > /tmp/badging.txt
          grep -q "versionCode='1646' versionName='16.46'" /tmp/badging.txt
          python3 - <<'PY'
          from zipfile import ZipFile
          apk='store/BY-EDS-SAHA-v16.46-TABLET.apk'
          with ZipFile(apk) as z:
              s=z.read('assets/ayb-tablet.js').decode('utf-8')
          assert "g(1,'AC1009')" in s
          assert "g(1,'AC1018')" not in s
          assert 'g(370' not in s
          print('APK DXF motoru strict AC1009 OK')
          PY
          sha256sum store/BY-EDS-SAHA-v16.46-TABLET.apk | tee store/BY-EDS-SAHA-v16.46-TABLET.apk.sha256
          printf 'BY EDS SAHA Tablet APK\nSurum: 16.46\nDXF: strict AC1009/R12 APPID acilma duzeltmesi\n' > store/BY-EDS-SAHA-v16.46-TABLET-BILGI.txt

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: BY-EDS-SAHA-v16.46-TABLET
          path: |
            store/BY-EDS-SAHA-v16.46-TABLET.apk
            store/BY-EDS-SAHA-v16.46-TABLET.apk.sha256
            store/BY-EDS-SAHA-v16.46-TABLET-BILGI.txt
          if-no-files-found: error

      - name: Dogrulanmis surumu dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/assets/ayb-tablet.js store/BY-EDS-SAHA-v16.46-TABLET.apk store/BY-EDS-SAHA-v16.46-TABLET.apk.sha256 store/BY-EDS-SAHA-v16.46-TABLET-BILGI.txt
          if ! git diff --cached --quiet; then
            git commit -m "BY EDS Saha v16.46 DXF APPID acilma duzeltmesi [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
