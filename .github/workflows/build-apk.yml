name: APK Olustur (AYB Saha v16.41 Tablet)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Yol olcusu ve trafo etiket duzeltmesini uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          import base64, zlib
          exec(zlib.decompress(base64.b64decode("")).decode("utf-8"), {"__name__": "__main__"})
          PY_PATCH

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text, n1 = re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*$', r'\1versionCode 1641', text, count=1)
          text, n2 = re.subn(r'(?m)^(\s*)versionName\s+"[^"]+"\s*$', r'\1versionName "16.41"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('build.gradle surum satirlari bulunamadi')
          gradle.write_text(text, encoding='utf-8')

          java = Path('app/src/main/java/com/bayramyaras/aybsaha/MainActivity.java').read_text(encoding='utf-8')
          required = [
              's.setBuiltInZoomControls(false);',
              's.setSupportZoom(false);',
              's.setLoadWithOverviewMode(false);',
              's.setTextZoom(100);',
              'web.setOverScrollMode(WebView.OVER_SCROLL_NEVER);',
          ]
          if not all(item in java for item in required):
              raise SystemExit('Tablet WebView ayarlari eksik')

          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          if 'android:largeHeap="true"' not in manifest or 'android:windowSoftInputMode="adjustResize"' not in manifest:
              raise SystemExit('Tablet manifest ayarlari eksik')
          PY

      - name: JavaScript ve regresyon kontrolu
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/ayb-tablet.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('app/src/main/assets/AYB_Saha_Harita.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          main = next((s for s in scripts if 'function getObjectLabelHTML' in s), None)
          if main is None:
              raise SystemExit('Ana arayuz JavaScript blogu bulunamadi')
          Path('/tmp/ayb-main-inline.js').write_text(main, encoding='utf-8')

          js = Path('app/src/main/assets/ayb-tablet.js').read_text(encoding='utf-8')
          checks = {
              'Yol olcusu buyuk sayi saga hizali': "txtEnt('YOL_OLCU',anaX,anaY,hAna,String(ana),'Standard',null,0,2,2)",
              'Yol olcusu ondalik sola hizali': "txtEnt('YOL_OLCU',ondX,ondY,hOnd,ond,'Standard',null,0,0,2)",
              'Yol olcusu guvenli bosluk': 'var bosluk=Math.max(0.18,hOnd*0.24);',
              'Trafo etiket katmani': "['TRAFO_ETIKET',5]",
              'Trafo tip satiri': "txtEnt('TRAFO_ETIKET',c.y,trY,trBinaH,trBina",
              'Trafo ad satiri': "txtEnt('TRAFO_ETIKET',c.y,trY,1.45,trBaslik",
              'Trafo guc satiri': "txtEnt('TRAFO_ETIKET',c.y,trY,1.30,trGuc",
          }
          for name, token in checks.items():
              if token not in js:
                  raise SystemExit(f'Eksik kontrol: {name}')
          if html.index('binaTipi?') > html.index('<span>${esc(baslik)}</span>'):
              raise SystemExit('Arayuz trafo etiket satir sirasi yanlis')
          print('Regresyon kontrolleri basarili.')
          PY
          node --check /tmp/ayb-main-inline.js

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenlerini kur
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: APK olustur
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: APK paketini ve imzasini dogrula
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="store/AYB-SAHA-v16.41-TABLET.apk"
          mkdir -p store
          cp "$APK" "$OUT"

          unzip -t "$OUT" >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$OUT"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$OUT" | tee /tmp/ayb-badging.txt
          grep -q "package: name='com.bayramyaras.aybsaha' versionCode='1641' versionName='16.41'" /tmp/ayb-badging.txt
          grep -q "sdkVersion:'23'" /tmp/ayb-badging.txt
          grep -q "targetSdkVersion:'34'" /tmp/ayb-badging.txt

          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path('store/AYB-SAHA-v16.41-TABLET.apk')
          expected = {
              'AYB_Saha_Harita.html': '9c419a253fb7c33e323698ed3aa6ec5ffcb39270bb0efd0d481fa078ba4d7886',
              'ayb-tablet.js': '04d42bce4c56e4a000b9caac70f87c35affd315efbba3a21d2d646d04cb4c866',
              'ayb-label-screen.js': '654763216f531e6d78fd6b6ea00047cccb541a3b6efda6b319b559bd61cc010a',
              'ayb-undo.js': 'ad3ef71cf7ceec8e9c92781209bd25449bde10f9e18ddf0b6dcf3bd6a8a37cfe',
          }
          with ZipFile(apk) as zf:
              for name, digest in expected.items():
                  actual = sha256(zf.read('assets/' + name)).hexdigest()
                  if actual != digest:
                      raise SystemExit(f'APK icindeki {name} hash uyusmazligi: {actual}')
                  print(f'APK asset OK: {name} {actual}')
          PY

          sha256sum "$OUT" | tee store/AYB-SAHA-v16.41-TABLET.apk.sha256
          {
            echo "AYB SAHA Tablet APK"
            echo "Surum: 16.41"
            echo "Paket: com.bayramyaras.aybsaha"
            echo "Min SDK: 23"
            echo "Target SDK: 34"
            echo "Duzeltme: Yol olcusu 33,50 ayrik TEXT; trafo tip/ad/guc etiketi arayuz + DXF"
            echo "Olusturan commit: ${GITHUB_SHA}"
            echo
            cat store/AYB-SAHA-v16.41-TABLET.apk.sha256
          } > store/AYB-SAHA-v16.41-TABLET-BILGI.txt

      - name: APK'yi indirilebilir paket olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: AYB-SAHA-v16.41-TABLET
          path: |
            store/AYB-SAHA-v16.41-TABLET.apk
            store/AYB-SAHA-v16.41-TABLET.apk.sha256
            store/AYB-SAHA-v16.41-TABLET-BILGI.txt
          if-no-files-found: error
          retention-days: 90

      - name: Dogrulanmis kaynak ve APK'yi ana dala kaydet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle \
            app/src/main/assets/AYB_Saha_Harita.html \
            app/src/main/assets/ayb-tablet.js \
            store/AYB-SAHA-v16.41-TABLET.apk \
            store/AYB-SAHA-v16.41-TABLET.apk.sha256 \
            store/AYB-SAHA-v16.41-TABLET-BILGI.txt
          if ! git diff --cached --quiet; then
            git commit -m "APK v16.41: yol olcusu ve trafo tip-ad-guc etiketi [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
