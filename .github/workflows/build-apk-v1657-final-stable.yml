name: APK Olustur - BY EDS SAHA V57 Final Stabil

on:
  push:
    branches: [ apk-v1657-final-stable ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: V57 tabanini temizle ve son duzeltmeleri uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v1657_final_stable.py app/src/main/assets/AYB_Saha_Harita.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          g=Path('app/build.gradle')
          s=g.read_text(encoding='utf-8')
          s=re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.bayramyaras.byedssaha.final57"', s, count=1)
          s=re.sub(r'versionCode\s+\d+', 'versionCode 16571', s, count=1)
          s=re.sub(r'versionName\s+"[^"]+"', 'versionName "16.57.1"', s, count=1)
          g.write_text(s,encoding='utf-8')

          Path('app/src/main/res/values/strings.xml').write_text(
              '<resources>\n    <string name="app_name">BY EDŞ SAHA</string>\n</resources>\n',
              encoding='utf-8')

          j=Path('app/src/main/java/com/bayramyaras/aybsaha/MainActivity.java')
          x=j.read_text(encoding='utf-8')
          x=x.replace('BY EDŞ Saha','BY EDŞ SAHA')
          j.write_text(x,encoding='utf-8')
          PY

          F=app/src/main/assets/AYB_Saha_Harita.html
          grep -q '<title>BY EDŞ SAHA</title>' "$F"
          grep -q '<div class="title">BY EDŞ SAHA</div>' "$F"
          grep -q 'id="aybRibbonTabs"' "$F"
          grep -q 'id="aybRibbonTools"' "$F"
          grep -q 'data-tool="sahanot"' "$F"
          grep -q 'Lamba Arızalı' "$F"
          grep -q 'Direk Hasarlı' "$F"
          grep -q 'Otomat Kapağı Yok' "$F"
          grep -q 'Otomat Kapağı Yok Kablolar Dışarda' "$F"
          grep -q 'window.aybSahaNotSil=function' "$F"
          grep -q 'ayb_v57_final_js' "$F"
          ! grep -q 'aybV28MobileDock' "$F"
          ! grep -q 'ayb_v28_same_program_mobile_js' "$F"
          ! grep -q 'ayb_v16_68_professional_ui_js' "$F"
          ! grep -q 'class="floating-palette"' "$F"
          ! grep -q 'class="left-tools"' "$F"

          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('app/src/main/assets/AYB_Saha_Harita.html').read_text(encoding='utf-8')
          required=['function newProject','function openProject','function saveProject','function renderAll','function exportKMZ']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Eksik motor fonksiyonu: '+repr(missing))
          order=['[data-tool="direk"]','[data-tool="trafo"]','[data-tool="yeraltihat"]','[data-tool="hat"]','[data-tool="abonehat"]','[data-tool="kanal"]','[data-tool="kofre"]','[data-tool="bina"]','[data-tool="box"]','[data-tool="sahanot"]','#aybYolOlcBtn','#kfMeasureToolBtn','[data-tool="cizgi"]','[data-tool="ok"]','#aybTopluSilBtn']
          pos=[]
          marker="['[data-tool=\"direk\"]'"
          start=s.rfind(marker)
          if start<0: raise SystemExit('Cizim sirasi kodu bulunamadi')
          frag=s[start:start+1200]
          for x in order:
              i=frag.find(x)
              if i<0: raise SystemExit('Sirada eksik: '+x)
              pos.append(i)
          if pos!=sorted(pos): raise SystemExit('Cizim sirasi yanlis')
          m=re.search(r'<script id="ayb_v57_final_js">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('Final script yok')
          Path('/tmp/v57final.js').write_text(m.group(1),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/v57final.js'],check=True)
          PY
          node --check app/src/main/assets/ayb-tablet.js

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenleri
        shell: bash
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: APK olustur ve paket icini dogrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          mkdir -p store /tmp/apkcheck
          cp app/build/outputs/apk/debug/app-debug.apk store/BY_EDS_SAHA_V57_FINAL_STABIL.apk
          unzip -t store/BY_EDS_SAHA_V57_FINAL_STABIL.apk >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging store/BY_EDS_SAHA_V57_FINAL_STABIL.apk > /tmp/badging.txt
          grep -q "package: name='com.bayramyaras.byedssaha.final57' versionCode='16571' versionName='16.57.1'" /tmp/badging.txt
          grep -q "application-label:'BY EDŞ SAHA'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs store/BY_EDS_SAHA_V57_FINAL_STABIL.apk | tee /tmp/sign.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/sign.txt
          unzip -q store/BY_EDS_SAHA_V57_FINAL_STABIL.apk 'assets/AYB_Saha_Harita.html' 'assets/ayb-tablet.js' -d /tmp/apkcheck
          F=/tmp/apkcheck/assets/AYB_Saha_Harita.html
          grep -q '<title>BY EDŞ SAHA</title>' "$F"
          grep -q 'ayb_v57_final_js' "$F"
          grep -q 'window.aybSahaNotSil=function' "$F"
          grep -q 'Otomat Kapağı Yok Kablolar Dışarda' "$F"
          ! grep -q 'aybV28MobileDock' "$F"
          ! grep -q 'ayb_v28_same_program_mobile_js' "$F"
          ! grep -q 'ayb_v16_68_professional_ui_js' "$F"
          sha256sum store/BY_EDS_SAHA_V57_FINAL_STABIL.apk | tee store/BY_EDS_SAHA_V57_FINAL_STABIL.apk.sha256
          cat > store/KONTROL.txt <<'EOF'
          BY EDŞ SAHA
          Taban: çalışan v16.57
          Sürüm: 16.57.1
          Ayrı paket: com.bayramyaras.byedssaha.final57
          Eski v28 arayüzü fiziksel olarak kaldırıldı.
          NOT: anında sembol, kalıcı silme, seri not, sabit 24 px sembol, hazır arıza listesi.
          Çizim araçları istenen sıraya alındı.
          EOF

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: BY_EDS_SAHA_V57_FINAL_STABIL
          path: |
            store/BY_EDS_SAHA_V57_FINAL_STABIL.apk
            store/BY_EDS_SAHA_V57_FINAL_STABIL.apk.sha256
            store/KONTROL.txt
          if-no-files-found: error
