name: APK Olustur (BY EDS Saha v16.57.3 Kirik Nokta Korumali)

on:
  push:
    branches: [ apk-v16573-vertex-lock ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: v16.57 tabanini ve son NOT duzeltmelerini uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v16572_note_stable.py

      - name: Kirik nokta korumasini uygula
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_v16573_vertex_lock.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          g=Path('app/build.gradle')
          s=g.read_text(encoding='utf-8')
          s=re.sub(r'applicationId\s+"[^"]+"','applicationId "com.bayramyaras.byedssaha.v573"',s,count=1)
          s=re.sub(r'versionCode\s+\d+','versionCode 16573',s,count=1)
          s=re.sub(r'versionName\s+"[^"]+"','versionName "16.57.3"',s,count=1)
          g.write_text(s,encoding='utf-8')
          Path('app/src/main/res/values/strings.xml').write_text('<resources>\n    <string name="app_name">BY EDŞ SAHA V57</string>\n</resources>\n',encoding='utf-8')
          PY
          F=app/src/main/assets/AYB_Saha_Harita.html
          grep -q 'V16.57.3: KIRIK NOKTA KORUMASI' "$F"
          grep -q 'Kırık Nokta Düzenlemeyi Aktif Et' "$F"
          grep -q "aybVertexEditStart('line'" "$F"
          grep -q "aybVertexEditStart('channel'" "$F"
          grep -q "if(!ch||!aybVertexEditIs('channel',ch.id)) return;" "$F"
          grep -q "if(!line||!aybIsLineYerAlti(line)||!aybVertexEditIs('line',line.id)) return;" "$F"
          grep -q 'BY EDŞ SAHA V57' "$F"
          grep -q 'Otomat Kapağı Yok Kablolar Dışarda' "$F"
          grep -q 'function newProject' "$F"
          grep -q 'function openProject' "$F"
          grep -q 'function saveProject' "$F"
          if grep -q 'aybV28MobileDock' "$F"; then echo 'Eski v28 dock bulundu'; exit 1; fi
          if grep -q 'ayb_v28_same_program_mobile_js' "$F"; then echo 'Eski v28 js bulundu'; exit 1; fi
          node --check app/src/main/assets/ayb-tablet.js
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('app/src/main/assets/AYB_Saha_Harita.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          core=next((x for x in scripts if 'function aybRenderChannelVertexHandles' in x and 'function finishCurrentOperation' in x),None)
          if not core: raise SystemExit('ana harita motoru scripti bulunamadi')
          Path('/tmp/core.js').write_text(core,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/core.js'],check=True)
          note=next((x for x in scripts if 'id="ayb_v572_enhance"' in x),None)
          # id script body regex ayrıca kontrol edilir
          m=re.search(r'<script id="ayb_v572_enhance">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('v572 note scripti bulunamadi')
          Path('/tmp/note.js').write_text(m.group(1),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/note.js'],check=True)
          PY

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK bilesenleri
        shell: bash
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: APK olustur ve dogrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace
          mkdir -p store /tmp/apkcheck
          cp app/build/outputs/apk/debug/app-debug.apk store/BYEDS-V57-3.apk
          unzip -t store/BYEDS-V57-3.apk >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging store/BYEDS-V57-3.apk > /tmp/badging.txt
          grep -q "package: name='com.bayramyaras.byedssaha.v573' versionCode='16573' versionName='16.57.3'" /tmp/badging.txt
          grep -q "application-label:'BY EDŞ SAHA V57'" /tmp/badging.txt
          unzip -q store/BYEDS-V57-3.apk 'assets/AYB_Saha_Harita.html' 'assets/ayb-tablet.js' -d /tmp/apkcheck
          F=/tmp/apkcheck/assets/AYB_Saha_Harita.html
          grep -q 'V16.57.3: KIRIK NOKTA KORUMASI' "$F"
          grep -q 'Kırık Nokta Düzenlemeyi Aktif Et' "$F"
          grep -q 'BY EDŞ SAHA V57' "$F"
          grep -q 'Otomat Kapağı Yok Kablolar Dışarda' "$F"
          if grep -q 'aybV28MobileDock' "$F"; then echo 'APK icinde eski v28 dock bulundu'; exit 1; fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs store/BYEDS-V57-3.apk > store/APK_IMZA_KONTROL.txt
          sha256sum store/BYEDS-V57-3.apk | tee store/BYEDS-V57-3.apk.sha256
          printf 'BY EDŞ SAHA V57\nSürüm: 16.57.3\nPaket: com.bayramyaras.byedssaha.v573\nYeraltı hat ve kanal kırık noktaları varsayılan kilitli; sağ tık/uzun bas ile seçili geometri için açılır, Bitir ile tekrar kilitlenir.\n' > store/BILGI.txt

      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: BYEDS-V57-3
          path: |
            store/BYEDS-V57-3.apk
            store/BYEDS-V57-3.apk.sha256
            store/APK_IMZA_KONTROL.txt
            store/BILGI.txt
          if-no-files-found: error
